<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BugLens AI logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bl-grad" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="58" y2="58">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Lens ring -->
  <circle cx="27" cy="27" r="18" fill="none" stroke="url(#bl-grad)" stroke-width="5"/>

  <!-- Handle -->
  <line x1="40.5" y1="40.5" x2="56" y2="56" stroke="url(#bl-grad)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Cyan lens highlight -->
  <path d="M15 22 A13 13 0 0 1 22 14.5" fill="none" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Abstract bug: antennae -->
  <g fill="none" stroke="url(#bl-grad)" stroke-width="2" stroke-linecap="round">
    <path d="M25 19 L22 13"/>
    <path d="M29 19 L32 13"/>
    <!-- Legs (circuit traces) -->
    <path d="M22 26 L17 24"/>
    <path d="M22 30 L16 30"/>
    <path d="M22 34 L17 37"/>
    <path d="M32 26 L37 24"/>
    <path d="M32 30 L38 30"/>
    <path d="M32 34 L37 37"/>
  </g>

  <!-- Circuit nodes at leg and antenna ends -->
  <g fill="#6366F1">
    <circle cx="22" cy="12.5" r="1.6"/>
    <circle cx="32" cy="12.5" r="1.6"/>
    <circle cx="16" cy="23.7" r="1.6"/>
    <circle cx="15" cy="30" r="1.6"/>
    <circle cx="16" cy="37.3" r="1.6"/>
    <circle cx="38" cy="23.7" r="1.6"/>
    <circle cx="39" cy="30" r="1.6"/>
    <circle cx="38" cy="37.3" r="1.6"/>
  </g>

  <!-- Bug head and body -->
  <circle cx="27" cy="21" r="3.2" fill="url(#bl-grad)"/>
  <ellipse cx="27" cy="30" rx="5.5" ry="8" fill="url(#bl-grad)"/>

  <!-- Cyan core node -->
  <circle cx="27" cy="30" r="2.2" fill="#22D3EE"/>
</svg>
